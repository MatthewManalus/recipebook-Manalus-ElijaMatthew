{% extends "base.html" %}

{% block title %}Recipe Book - List{% endblock %}
{% block page_heading %}Recipe List{% endblock %}

{% block content %}
  {% if user.is_authenticated %}
    <p><a href="{% url 'ledger:recipe-add' %}">Add a new recipe</a></p>
  {% endif %}

  <ul>
    {% for r in recipes %}
      <li><a href="{{ r.get_absolute_url }}">{{ r.name }}</a></li>
    {% endfor %}
  </ul>
{% endblock %}
