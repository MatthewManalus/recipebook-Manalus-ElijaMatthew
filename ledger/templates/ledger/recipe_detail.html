
{% extends "base.html" %}

{% block title %}Recipe Book - {{ name }}{% endblock %}

{% block content %}
  <h2>{{ name }}</h2>
  <ul>
    {% for ing in ingredients %}
      <li>{{ ing.name }} — {{ ing.quantity }}</li>
    {% endfor %}
  </ul>

  <p><a href="/recipes/list">Back to list</a></p>
{% endblock %}
