{% extends "base.html" %}

{% block title %}Recipe Book - {{ recipe.name }}{% endblock %}

{% block content %}
  <h2>{{ recipe.name }}</h2>

  <ul>
    {% for ri in recipe.ingredients.all %}
      <li>{{ ri.ingredient.name }} — {{ ri.quantity }}</li>
    {% endfor %}
  </ul>

  <p><a href="/recipes/list">Back to list</a></p>
{% endblock %}
