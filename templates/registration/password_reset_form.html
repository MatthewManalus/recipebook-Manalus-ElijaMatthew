{% extends "base.html" %}

{% block title %}Password Reset{% endblock %}
{% block page_heading %}Reset your password{% endblock %}

{% block content %}
  <p>Enter your email address to reset your password.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset email</button>
  </form>
{% endblock %}
