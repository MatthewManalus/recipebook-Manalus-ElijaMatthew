{% extends "base.html" %}

{% block title %}Recipe Book - Login{% endblock %}
{% block page_heading %}Login{% endblock %}

{% block content %}
  {% if form.errors %}
    <p>Login failed. Please try again.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>

  <p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
{% endblock %}
